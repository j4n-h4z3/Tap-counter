<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="50%" stop-color="#FF2D55"/>
      <stop offset="100%" stop-color="#FF9500"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#FF2D55"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="100" height="100" rx="22" ry="22"/>
    </clipPath>
  </defs>
  <!-- Outer gradient border -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>
  <!-- Dark inner background -->
  <rect x="3" y="3" width="94" height="94" rx="19" ry="19" fill="#0A0A0F"/>
  <!-- +1 text -->
  <text x="50" y="68" font-family="'Outfit', system-ui, -apple-system, sans-serif"
        font-weight="800" font-size="44" text-anchor="middle"
        fill="url(#text)">+1</text>
</svg>
